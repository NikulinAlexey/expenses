<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Учёт трат</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>Учёт трат</h1>
  <div class="actions">
    <button id="exportJson" title="Полная копия всех данных">⬇ Скачать всё (JSON)</button>
    <button id="exportCsv" class="ghost" title="Таблица для Excel">⬇ CSV для Excel</button>
    <label class="btn ghost">⬆ Загрузить из файла<input type="file" id="importFile" accept=".json,application/json" hidden></label>
  </div>
</header>

<main>
  <section class="card">
    <h2 id="formTitle">Новая трата</h2>
    <form id="form">
      <input id="item" placeholder="Вещь (например, молоко)" required>
      <select id="cat" required></select>
      <input id="amount" type="number" step="0.01" min="0" placeholder="Сумма, ₽" required>
      <input id="date" type="date" required>
      <button type="submit" id="submitBtn">Добавить</button>
      <button type="button" id="cancel" class="ghost" hidden>Отмена</button>
    </form>
  </section>

  <section class="card">
    <div class="row"><h2>Месяц</h2><select id="month"></select></div>
    <div id="kpis" class="kpis"></div>
  </section>

  <section class="card">
    <h2>По категориям</h2>
    <div id="cats"></div>
  </section>

  <section class="card">
    <div class="row"><h2>Динамика по месяцам</h2><select id="trendCat"></select></div>
    <div id="chart" class="chart"></div>
    <p id="trendNote" class="muted"></p>
  </section>

  <section class="card">
    <h2>Сводная таблица: категории × месяцы</h2>
    <div class="scroll"><table id="pivot"></table></div>
  </section>

  <section class="card">
    <h2>Траты за выбранный месяц</h2>
    <div class="scroll"><table id="list"></table></div>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
